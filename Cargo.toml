[package]
name = "pg_agent_gate"
version = "0.1.0"
edition = "2021"
description = "Agents propose, PostgreSQL decides: a native gate between LLM agents and the database"
license = "PostgreSQL"

[lib]
crate-type = ["cdylib"]

# PostgreSQL 18 is the floor: dry_run shows the before and after of every row
# with RETURNING old/new, which does not exist earlier.
[features]
default = ["pg19"]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18"]
pg19 = ["pgrx/pg19", "pgrx-tests/pg19"]
pg_test = []

[dependencies]
pgrx = "=0.19.2"
serde_json = "1"

[dev-dependencies]
pgrx-tests = "=0.19.2"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
