# The demo image is the front door for anyone without Rust, and nothing else in CI builds it.
# Build it and run the demo in it whenever the Dockerfile or its ignore list changes. amd64
# only (the GitHub runner); on an ARM Mac it would run emulated.
name: docker

on:
  pull_request:
    paths: ['Dockerfile', '.dockerignore']
  push:
    branches: [main]
    paths: ['Dockerfile', '.dockerignore']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: build and run the demo image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: build the image
        run: docker build -t pg_agent_gate-demo:ci .

      - name: run the demo in it
        run: docker run --rm pg_agent_gate-demo:ci
