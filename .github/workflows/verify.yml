# Every push and pull request runs the attacks. For a security extension, CI is not
# "the build passes": it is the claim that no guarantee broke, re-proved on every commit.
#
# Each job is `make clean-machine` -- the exact command anyone can run locally -- for one
# PostgreSQL major: a fresh Debian container, PostgreSQL from PGDG (19 resolves to the
# newest 19 beta), cargo-pgrx 0.19.2, pg_living_assertions from its public repository,
# the repository as committed, `make verify` as a user that is not root. One definition
# of "verified", not a second one in YAML that can drift from it.
#
# To block merges on it: Settings -> Branches -> require the status checks
# "verify (PostgreSQL 18)" and "verify (PostgreSQL 19)".
name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify (PostgreSQL ${{ matrix.pg }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        pg: [18, 19]
    steps:
      - uses: actions/checkout@v4

      - name: clean machine, PostgreSQL ${{ matrix.pg }}
        run: PG_MAJOR=${{ matrix.pg }} ENGINE=docker bash tests/clean-machine/run.sh

      - name: logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-logs-pg${{ matrix.pg }}
          path: target/clean-machine-pg${{ matrix.pg }}
          if-no-files-found: warn

  # The two things the README shows, re-proved on every commit on a fresh cluster -- the
  # same commands anyone runs after a fork:
  #   * `make contrast`: the same statement an ordinary connection runs (gone) and the gate
  #     refuses, and the rich verification the gate returns instead of a bare result.
  #   * `make mcp`: a real MCP client, through gated-mcp (which connects AS THE AGENT ROLE
  #     and holds no power), can only operate the gate -- the official @modelcontextprotocol
  #     client, both protocol eras.
  # Every change is checked from outside the gate by a superuser. Neither depends on the
  # PostgreSQL major, so one is enough to prove them.
  end-to-end:
    name: end-to-end (contrast + a real MCP client)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PG_MAJOR: "18"
      PGRX_VERSION: "0.19.2"
    steps:
      - uses: actions/checkout@v4

      - name: PostgreSQL ${{ env.PG_MAJOR }} and a build toolchain, from PGDG
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main $PG_MAJOR" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            postgresql-$PG_MAJOR postgresql-server-dev-$PG_MAJOR \
            build-essential clang libclang-dev pkg-config
          echo "/usr/lib/postgresql/$PG_MAJOR/bin" >> "$GITHUB_PATH"

      - name: cargo-pgrx ${{ env.PGRX_VERSION }}
        run: |
          cargo install cargo-pgrx --version "$PGRX_VERSION" --locked
          cargo pgrx init --pg$PG_MAJOR "/usr/lib/postgresql/$PG_MAJOR/bin/pg_config"

      - name: the gate vs an ordinary connection, side by side
        run: make contrast PG_CONFIG=/usr/lib/postgresql/$PG_MAJOR/bin/pg_config

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: oven-sh/setup-bun@v2

      - name: a real MCP client operates the gate
        run: make mcp PG_CONFIG=/usr/lib/postgresql/$PG_MAJOR/bin/pg_config

      - name: logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: end-to-end-gated-mcp-log
          path: .testcluster/gated-mcp.log
          if-no-files-found: warn
